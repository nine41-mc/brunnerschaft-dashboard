name = "brunnerschaft-push"
main = "worker.js"
compatibility_date = "2026-09-01"
account_id = "94ecf1a532fd478f390323d7f5756be8"

# KV-Namespace für die Push-Abos — die ID trägt setup-push.sh automatisch ein
[[kv_namespaces]]
binding = "SUBS"
id = "7824c3abf05648a4bcb87e346a85e5db"

# Tipp-Erinnerung: läuft TÄGLICH 15:00 UTC — der Worker prüft selbst via OpenLigaDB,
# ob der nächste Spieltag heute startet (Cloudflare-Cron zählt 1=Sonntag, "5" war Donnerstag!)
[triggers]
crons = ["0 15 * * *"]
