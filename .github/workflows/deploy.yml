name: Build & Deploy Brunnerschaft-Dashboard

on:
  schedule:
    - cron: '0 5 * * *'       # täglich morgens (Basis-Refresh)
    - cron: '0 21 * * 5'      # Fr ~23:00 MESZ (nach dem Freitagsspiel)
    - cron: '30 15 * * 6'     # Sa ~17:30 MESZ (nach der Konferenz)
    - cron: '0 18 * * 6'      # Sa ~20:00 MESZ (nach dem Topspiel)
    - cron: '0 13-18 * * 0'   # So stündlich ~15:00–20:00 MESZ
    - cron: '30 17,19 * * 2,3' # Di/Mi abends (Pokal-/Nachholtermine)
    # Hinweis: GitHub-Cron läuft in UTC (Winterzeit verschiebt alles um +1 h lokal) und feuert oft 10–40 min verspätet.
  workflow_dispatch:          # manuell auslösbar
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - run: npm ci
      - name: Build (scrape + render)
        env:
          BRUN_FIN_PASSWORD: ${{ secrets.BRUN_FIN_PASSWORD }}
          BRUN_FINANCE_JSON: ${{ secrets.BRUN_FINANCE_JSON }}
        run: node build.js
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v5
