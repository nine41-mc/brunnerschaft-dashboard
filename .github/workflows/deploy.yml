name: Build & Deploy Brunnerschaft-Dashboard

on:
  schedule:
    - cron: '0 5 * * *'        # täglich morgens (Basis-Refresh)
    - cron: '*/5 18-20 * * 5'  # Fr alle 5 min, ~20:00–23:00 MESZ (Freitagsspiel live)
    - cron: '*/5 13-18 * * 6'  # Sa alle 5 min, ~15:00–21:00 MESZ (Konferenz + Topspiel live)
    - cron: '*/5 13-19 * * 0'  # So alle 5 min, ~15:00–22:00 MESZ (Sonntagsspiele live)
    - cron: '30 17,19 * * 2,3' # Di/Mi abends (Pokal-/Nachholtermine)
    # Hinweis: GitHub-Cron läuft in UTC (Winterzeit verschiebt alles um +1 h lokal); 5-min-Schedules
    # feuern erfahrungsgemäß eher alle 5–15 min. concurrency (cancel-in-progress) verhindert Staus.
  workflow_dispatch:          # manuell auslösbar
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - run: npm ci
      - name: Build (scrape + render)
        env:
          BRUN_FIN_PASSWORD: ${{ secrets.BRUN_FIN_PASSWORD }}
          BRUN_FINANCE_JSON: ${{ secrets.BRUN_FINANCE_JSON }}
        run: node build.js
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v5
