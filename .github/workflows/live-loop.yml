name: Live-Loop (Spieltage)

# GitHub führt Schedules unzuverlässig aus (an Spieltagen wurden ganze Stunden verschluckt).
# Darum: (a) Trigger versetzt zur vollen Stunde (:07/:37 — Minute 0 wird am häufigsten verworfen),
# (b) jeder Lauf deployt bis zum ENDE des Spielfensters — ein einziger erfolgreicher Trigger
# deckt damit den ganzen Nachmittag ab. Parallel gestartete Läufe warten in der Queue und
# beenden sich sofort, wenn das Fenster vorbei ist.
on:
  schedule:
    # Cron läuft in UTC — die Fenster decken Sommer- (UTC+2) und Winterzeit (UTC+1) ab;
    # das eigentliche Ende bestimmt der Loop unten in Berliner Ortszeit.
    - cron: '7,37 18-21 * * 5'  # Fr ~19/20–23 Uhr
    - cron: '7,37 13-19 * * 6'  # Sa ~14/15–21 Uhr
    - cron: '7,37 13-20 * * 0'  # So ~14/15–22 Uhr
  workflow_dispatch:             # manuell startbar (Pokalabende: läuft dann mind. 1 Stunde)

permissions:
  actions: write

concurrency:
  group: live-loop
  cancel-in-progress: false

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Deploy alle 5 Minuten bis zum Fenster-Ende
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Fenster-Ende in BERLINER Ortszeit je Wochentag — gilt so für Sommer- UND Winterzeit
          # (letzter Anpfiff + ~2 h: Fr 20:30 → 23:10, Sa 18:30 → 21:10, So 19:30 → 21:40)
          DOW=$(TZ=Europe/Berlin date +%u)   # 1=Mo … 5=Fr 6=Sa 7=So
          case "$DOW" in
            5) END=$(TZ=Europe/Berlin date -d "today 23:10" +%s) ;;
            6) END=$(TZ=Europe/Berlin date -d "today 21:10" +%s) ;;
            7) END=$(TZ=Europe/Berlin date -d "today 21:40" +%s) ;;
            *) END=0 ;;
          esac
          NOW=$(date -u +%s)
          MIN_END=$((NOW + 3600))
          [ "$END" -lt "$NOW" ] && END=$MIN_END   # außerhalb des Fensters: 1h Fallback
          HARD_END=$((NOW + 340*60))              # Job-Limit nicht reißen
          [ "$END" -gt "$HARD_END" ] && END=$HARD_END
          echo "Loop bis $(date -u -d @$END +%H:%M) UTC"
          while [ "$(date -u +%s)" -lt "$END" ]; do
            gh workflow run deploy.yml --repo "${{ github.repository }}" || true
            sleep 300
          done
          gh workflow run deploy.yml --repo "${{ github.repository }}" || true
