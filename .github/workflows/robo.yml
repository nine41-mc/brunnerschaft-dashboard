name: 🤖 RoboBrunner tippt

# Tippt den nächsten offenen Spieltag automatisch — Do abends + Fr vormittags (Sicherheitsnetz;
# Kicktipp überschreibt identische Tipps einfach). Ohne Bot-Secrets beendet sich der Lauf harmlos.
on:
  schedule:
    - cron: '0 16 * * 4'   # Do ~18:00 MESZ
    - cron: '0 9 * * 5'    # Fr ~11:00 MESZ (Netz, falls Do verworfen wurde)
  workflow_dispatch:
    inputs:
      dry:
        description: 'Nur anzeigen, nicht abgeben'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  tip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - run: npm ci
      - name: Tippen
        env:
          KICKTIPP_BOT_EMAIL: ${{ secrets.KICKTIPP_BOT_EMAIL }}
          KICKTIPP_BOT_PASSWORD: ${{ secrets.KICKTIPP_BOT_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node robo.js ${{ inputs.dry && '--dry' || '' }}
      - name: Tipps + Begründungen ins Repo (erscheinen im Dashboard)
        run: |
          if [ -n "$(git status --porcelain robo-tips.json)" ]; then
            git config user.name "RoboSepp" && git config user.email "robo@brunnerschaft.local"
            git add robo-tips.json && git commit -m "🤖 RoboSepp: Tipps + Begründungen" && git push
          else echo "Keine neuen Tipps."; fi
